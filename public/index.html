<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0F1E3D"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>I.O.U.</title>
<style>
:root{--bg0:#060D20;--bg1:#0F1E3D;--gold:#F2B632;--ink:#F3F6FF;--mute:rgba(243,246,255,.72);--glass:rgba(255,255,255,.09);--edge:rgba(255,255,255,.18);--ok:#7DF0E2;--bad:#FFB3B3}
*{box-sizing:border-box}html{background:var(--bg0)}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:120px;background-attachment:fixed;
background:radial-gradient(520px 420px at 85% -5%,rgba(242,182,50,.28),transparent 70%),radial-gradient(560px 480px at -10% 35%,rgba(61,214,198,.2),transparent 70%),radial-gradient(600px 500px at 90% 95%,rgba(120,90,255,.22),transparent 70%),linear-gradient(180deg,var(--bg1),var(--bg0));background-attachment:fixed}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;max-width:640px;margin:0 auto}
header b{font-size:22px;letter-spacing:.5px}header b i{color:var(--gold);font-style:normal}
main{max-width:640px;margin:0 auto;padding:4px 16px 16px}
.card,.tile,nav,.hero{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 8px 32px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.16)}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:24px;background:linear-gradient(135deg,rgba(242,182,50,.22),rgba(255,255,255,.07) 55%)}
.hero small{color:var(--mute)}.hero h1{margin:4px 0;font-size:40px;font-weight:800;letter-spacing:-.02em}
.bolt{position:absolute;right:-6px;top:-8px;width:130px;fill:var(--gold);opacity:.24;filter:drop-shadow(0 0 18px var(--gold))}
.card{border-radius:16px;padding:14px;margin:10px 0}h2{font-size:17px;margin:22px 0 6px}h3{margin:0 0 4px;font-size:16px}.mute{color:var(--mute);font-size:13px}.in{color:var(--ok)}
b,h1{font-variant-numeric:tabular-nums}
input{width:100%;padding:12px;background:rgba(255,255,255,.07);border:1px solid var(--edge);border-radius:12px;color:var(--ink);margin:5px 0;font:inherit}
input::placeholder{color:rgba(243,246,255,.62)}input[type=date]{color-scheme:dark}
button{font:inherit;background:linear-gradient(135deg,#FFD166,var(--gold));color:#0F1E3D;border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;transition:transform .12s}
button:active{transform:scale(.97)}button.alt{background:var(--glass);color:var(--ink);border:1px solid var(--edge)}button:disabled{opacity:.4}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.av{width:38px;height:38px;border-radius:50%;margin-left:8px;padding:0;font-weight:800;background:var(--glass);color:var(--ink);border:1px solid var(--edge)}
.av.on{background:var(--gold);color:#0F1E3D;border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,182,50,.25)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.bar{height:9px;background:rgba(255,255,255,.12);border-radius:8px;overflow:hidden;margin:6px 0}.bar div{height:100%;background:linear-gradient(90deg,var(--gold),#FFD98A);border-radius:8px;box-shadow:0 0 10px rgba(242,182,50,.6);transition:width .6s}
.tile{border-radius:16px;padding:14px 6px;text-align:center;cursor:pointer;font-size:13px;transition:transform .15s,border-color .15s}.tile:hover{transform:translateY(-2px)}
.tile.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,182,50,.4)}
.logo{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;color:#fff;font-weight:700;position:relative;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.tag{font-size:12px;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.14)}.tag.ok{background:rgba(61,214,198,.2);color:var(--ok)}.tag.lock{background:rgba(242,182,50,.2);color:#FFD98A}
.chips{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap}.chip{background:var(--glass);color:var(--ink);border:1px solid var(--edge);padding:6px 14px;border-radius:20px;font-weight:600}.chip.on{background:var(--ink);color:#0F1E3D}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats .card{margin:8px 0;padding:10px}.stats b{font-size:14px}
nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(92%,420px);display:flex;padding:6px;border-radius:28px;z-index:9}
nav button{flex:1;background:none;box-shadow:none;color:var(--mute);padding:8px 2px;font-size:12px;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#0F1E3D;background:linear-gradient(135deg,#FFD166,var(--gold))}
.warn{background:rgba(255,107,107,.16);color:var(--bad);border:1px solid rgba(255,107,107,.4);padding:10px 12px;border-radius:12px;font-size:13px;margin-bottom:8px}
#toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:#fff;color:#0F1E3D;font-weight:600;padding:10px 16px;border-radius:14px;opacity:0;transition:.25s;max-width:90%;pointer-events:none;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:#FFD6D6;color:#7A1010}
#fx{position:fixed;inset:0;display:grid;place-items:center;font-size:110px;pointer-events:none;opacity:0;filter:drop-shadow(0 0 30px var(--gold));z-index:15}
#fx.go{animation:pop 1s ease}@keyframes pop{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1)}}
.sk{height:90px;background:linear-gradient(100deg,rgba(255,255,255,.06) 30%,rgba(255,255,255,.16) 50%,rgba(255,255,255,.06) 70%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.wide{width:100%;margin:14px 0 4px;padding:14px;font-size:16px}
.ring{width:84px;height:84px;flex:none}.ring text{fill:var(--ink);font-weight:800;font-size:17px}
.rb,.rf{fill:none;stroke-width:8;transform:rotate(-90deg);transform-origin:40px 40px}.rb{stroke:rgba(255,255,255,.14)}
.rf{stroke:var(--gold);stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(242,182,50,.7));animation:rf 1.1s .15s ease-out both}@keyframes rf{from{stroke-dashoffset:var(--from)}}
.sv.ani{animation:rise .5s both;animation-delay:calc(var(--i)*90ms)}@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.ms{display:flex;gap:6px;margin-top:10px}.ms span{flex:1;text-align:center;font-size:12px;padding:3px 0;border-radius:8px;background:rgba(255,255,255,.08);color:var(--mute)}.ms span.hit{background:rgba(242,182,50,.22);color:#FFD98A;font-weight:700}
#sheet{position:fixed;inset:0;background:rgba(3,8,20,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:30}#sheet.show{display:flex}
.panel{width:min(100%,520px);background:rgba(20,34,68,.97);border:1px solid var(--edge);border-radius:24px 24px 0 0;padding:20px 20px 28px;animation:up .3s}@keyframes up{from{transform:translateY(40px);opacity:0}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 10px;border-radius:16px;font-weight:400}.opt span{font-size:34px}.opt small{color:var(--mute);font-size:12px;text-align:center}
.ems{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.em{color:var(--ink);background:var(--glass);border:1px solid var(--edge);padding:8px 10px;font-size:20px;border-radius:12px}.em.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,182,50,.4)}
.cf{position:fixed;left:50%;top:45%;width:9px;height:14px;border-radius:2px;z-index:40;pointer-events:none;animation:cf 1.3s cubic-bezier(.2,.7,.3,1) forwards}@keyframes cf{to{transform:translate(var(--x),calc(var(--y) + 260px)) rotate(var(--r));opacity:0}}
.send{background:linear-gradient(135deg,rgba(61,214,198,.16),rgba(255,255,255,.07))}
.av.big{width:48px;height:48px;font-size:18px;margin:0;flex:none;display:grid;place-items:center;border-radius:50%}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.cats .tile{padding:16px 8px;font-size:14px}.cats .tile span{display:block;font-size:28px;margin-bottom:4px}
.tile.ani{animation:rise .45s both;animation-delay:calc(var(--i)*60ms)}
#rcpt{position:fixed;inset:0;background:rgba(3,8,20,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;overflow:auto}#rcpt.show{display:flex}
.paper{background:#fff;color:#0F1E3D;width:min(100%,380px);border-radius:22px;padding:24px;text-align:center;animation:pp .45s cubic-bezier(.3,1.4,.5,1) both;box-shadow:0 20px 60px rgba(0,0,0,.5)}@keyframes pp{from{opacity:0;transform:scale(.9) translateY(20px)}}
.paper h2{margin:10px 0 2px;font-size:20px}.paper .amt{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}.paper .mute{color:#5b6785}
.okc{width:76px;height:76px}.okc .c{fill:rgba(30,158,106,.12);stroke:#1E9E6A;stroke-width:3;stroke-dasharray:145;animation:d1 .5s ease-out both}.okc .k{fill:none;stroke:#1E9E6A;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;animation:d2 .35s .45s ease-out both}
@keyframes d1{from{stroke-dashoffset:145}}@keyframes d2{from{stroke-dashoffset:40}}
.tear{border-top:2px dashed #cfd6e6;margin:16px 0}.rw{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14px;text-align:left}.rw span{color:#5b6785}.rw b{text-align:right;word-break:break-all}
.paper button{width:100%;margin-top:10px}.paper button.alt{background:#EEF1F8;color:#0F1E3D;border-color:#d5dbe9}#toast{z-index:60}
.qr{background:#fff;border-radius:16px;padding:10px;width:min(100%,300px);margin:12px auto}.qr img{width:100%;display:block}
.vid{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1;max-width:320px;margin:10px auto}.vid video{width:100%;height:100%;object-fit:cover}.frame{position:absolute;inset:18%;border:3px solid var(--gold);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.alt-lbl{display:block;text-align:center;margin-top:10px;padding:12px;border-radius:12px;background:var(--glass);border:1px solid var(--edge);font-weight:700;cursor:pointer}
.brow{border-top:1px solid var(--edge);margin-top:12px;padding-top:12px}.avs{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin:6px 0}
.av.sm{width:28px;height:28px;font-size:12px;margin:0 4px 0 0;display:grid;place-items:center;border-radius:50%}
.quote{background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;margin:8px 0}.rw2{display:flex;justify-content:space-between;padding:3px 0}
.steps{list-style:none;padding:0;margin:14px 0}.steps li{display:flex;align-items:center;gap:12px;padding:8px 0;color:var(--mute)}
.steps li i{width:24px;height:24px;border-radius:50%;border:2px solid var(--edge);display:grid;place-items:center;font-style:normal;font-size:13px;flex:none}
.steps li.done,.steps li.act{color:var(--ink)}.steps li.done i{background:var(--gold);border-color:var(--gold);color:#0F1E3D}
.steps li.act i{border-color:var(--gold);border-top-color:transparent;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@supports not (backdrop-filter:blur(1px)){.card,.tile,nav,.hero{background:#1B2E57}}
@media(prefers-reduced-transparency:reduce){.card,.tile,nav,.hero,.av,.chip{background:#1B2E57;backdrop-filter:none;-webkit-backdrop-filter:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><b>I.O.<i>U.</i></b><div id="who" role="group" aria-label="Acting as"></div></header>
<main id="app"></main><div id="toast" role="status"></div><div id="fx" aria-hidden="true">⚡</div><div id="sheet" role="dialog" aria-modal="true" onclick="if(event.target===this)closeSheet()"><div class="panel" id="panel"></div></div><div id="rcpt" role="dialog" aria-modal="true" aria-label="Payment receipt" onclick="if(event.target===this)closeRcpt()"></div>
<nav id="nav"></nav>
<script src="/vendor/jsQR.js"></script>
<script>
let U='alice',D=30,S={},tab='home',cat=null,prov=null;
const $=s=>document.querySelector(s),fmt=n=>'MWK '+Math.round(n).toLocaleString();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val=i=>document.getElementById(i).value,cap=s=>s[0].toUpperCase()+s.slice(1);
const CATS={'Entertainment':['Spotify','Netflix','Showmax','DStv'],'Utilities':['ESCOM Electricity','Water Board','Airtel Airtime','TNM Airtime'],
'Transfer money':['Airtel Money','TNM Mpamba','National Bank','Standard Bank','FDH Bank','NBS Bank','Ecobank','First Capital','CDH Bank']};
const ini=n=>{const w=n.replace(/ Bank$/,'').split(' '),c=/^[A-Z]{2,3}$/.test(w[0]);return c?w[0]:w.length==1?w[0].slice(0,2):w.map(x=>x[0]).join('').slice(0,2)};
const BR={'Spotify':'#1DB954','Netflix':'#E50914','Airtel Money':'#E4002B','Airtel Airtime':'#E4002B','DStv':'#0B63CE'};
const logo=n=>{const f=n.toLowerCase().replace(/[^a-z0-9]+/g,'-');
 return `<div class="logo" style="background:${BR[n]||'hsl('+hue(n)+' 45% 38%)'}">${esc(ini(n))}<img src="logos/${f}.png" alt="" onerror="if(!this.dataset.t){this.dataset.t=1;this.src=this.src.replace('.png','.svg')}else this.remove()"></div>`};
const BASE=(localStorage.getItem('iou_server')||'').replace(/\/$/,'');
async function api(p,b){const r=await fetch(BASE+'/api/'+p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});const j=await r.json();if(!r.ok)throw new Error(j.error);return j}
async function load(){S=await api('state?user='+U+'&days='+D);render()}
async function act(p,b,m){if(busy)return;busy=true;toast('Sending...');
 try{await api(p,b);await load();toast(m||'Done');if(/pay|deposit|withdraw/.test(p))celebrate()}catch(e){toast(e.message,1)}finally{busy=false}}
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className='show'+(bad?' bad':'');setTimeout(()=>t.className='',3800)}
const IC={home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',pay:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',split:'<circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/>',save:'<rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>'};
const TABS={home:'Home',pay:'Pay',split:'Split',save:'Savings',cash:'Cash'};
IC.cash='<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>';
let shown=0,busy=false,ANIM=true,PANIM=true,SANIM=true,PP={},G={},NODES={},stream=null,scanning=false,poll=null;
const hue=n=>{let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;return h};
function countUp(el,to){const from=shown,t0=performance.now();shown=to;
 if(matchMedia('(prefers-reduced-motion:reduce)').matches||from===to){el.textContent=fmt(to);return}
 const step=t=>{const k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
function celebrate(){const f=$('#fx');f.className='';void f.offsetWidth;f.className='go';navigator.vibrate&&navigator.vibrate(25)}
function go(t){tab=t;ANIM=true;SANIM=true;render()}
function srvSheet(){openSheet(`<h3>Server address</h3><div class="mute">The computer running <b>npm start</b>, for example http://192.168.1.23:3000. Leave empty to use the server this page came from.</div><input id="sv" value="${esc(BASE)}" placeholder="http://192.168.1.23:3000" inputmode="url"><button class="wide" onclick="saveSrv()">Save and reload</button>`)}
function saveSrv(){const v=val('sv').trim().replace(/\/$/,'');v?localStorage.setItem('iou_server',v):localStorage.removeItem('iou_server');location.reload()}
function who(){$('#who').innerHTML=['alice','bob'].map(u=>`<button class="av ${u==U?'on':''}" title="Switch to ${cap(u)}" aria-pressed="${u==U}" onclick="U='${u}';load()">${u[0].toUpperCase()}</button>`).join('')+'<button class="av" aria-label="Server settings" onclick="srvSheet()">⚙</button>'}
function render(){who();$('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')"><svg viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>${v}</button>`).join('');
 $('#app').innerHTML=(S.error?`<div class="warn">Can't reach ${cap(U)}'s node: ${esc(S.error)}</div>`:'')+({home,pay,split,save,cash}[tab])();
 const b=$('#bal');if(b&&b.dataset.v!=='')countUp(b,+b.dataset.v)}
function focusAm(){setTimeout(()=>{const a=$('#am');a&&a.scrollIntoView({block:'center',behavior:'smooth'})},60)}
function pv(a='am',o='pv'){const v=+$('#'+a).value;$('#'+o).textContent=v>0?'About '+Math.max(1,Math.round(v/S.rate*1e8)).toLocaleString()+' sats at today\'s rate':''}
function home(){const m=S.summary,cats=Object.entries(m.byCat).sort((a,b)=>b[1]-a[1]),max=cats.length?cats[0][1]:1;
 const pots=S.savings.slice(0,3),when=t=>{const d=new Date(t);return d.toLocaleDateString([],{day:'numeric',month:'short'})+', '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})};
 return `<div class="hero"><svg class="bolt" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><small>${cap(U)}'s wallet</small><h1 id="bal" data-v="${S.balanceMwk??''}">${S.balanceMwk==null?'Offline':fmt(S.balanceMwk)}</h1>
 <small>${S.balanceSats==null?'Check that Polar is running':S.balanceSats.toLocaleString()+' sats to spend · room to receive '+fmt(S.inboundMwk)}</small></div>
 <div class="chips">${[[7,'7 days'],[30,'30 days'],[0,'All time']].map(([d,l])=>`<button class="chip ${D==d?'on':''}" onclick="D=${d};load()">${l}</button>`).join('')}</div>
 <div class="stats"><div class="card"><div class="mute">Spent</div><b>${fmt(m.spent)}</b></div><div class="card"><div class="mute">Received</div><b class="in">${fmt(m.received)}</b></div><div class="card"><div class="mute">Saved</div><b>${fmt(m.saved)}</b></div></div>
 ${S.owe>0?`<div class="card row"><div><b>You owe ${fmt(S.owe)}</b><div class="mute">${S.oweCount} open bill${S.oweCount>1?'s':''}</div></div><button onclick="go('split')">Pay</button></div>`:''}
 ${S.owed>0?`<div class="card row"><div><b>${fmt(S.owed)} owed to you</b><div class="mute">Waiting on your split bills</div></div><button class="alt" onclick="go('split')">View</button></div>`:''}
 <h2>Savings</h2>${pots.map(s=>`<div class="card"><div class="row"><b>${esc(s.name)}</b><span class="tag ${s.withdrawn?'':s.unlocked?'ok':'lock'}">${s.withdrawn?'Paid out':s.unlocked?'Unlocked':'Locked'}</span></div><div class="bar"><div style="width:${Math.min(100,s.saved/s.target*100)}%"></div></div><div class="mute">${fmt(s.saved)} of ${fmt(s.target)}</div></div>`).join('')||'<div class="card row"><span class="mute">No savings pots yet.</span><button class="alt" onclick="go(\'save\')">Start one</button></div>'}
 <h2>Where your money went</h2><div class="card">${cats.length?cats.map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${fmt(v)}</b></div><div class="bar"><div style="width:${v/max*100}%;background:hsl(${hue(k)} 75% 62%)"></div></div>`).join(''):'<div class="row"><span class="mute">No spending in this period.</span><button class="alt" onclick="go(\'pay\')">Make a payment</button></div>'}</div>
 <h2>Recent activity</h2>${S.txs.map(t=>`<div class="card row"><div><b>${esc(t.title)}</b><div class="mute">${esc(t.category)} · ${when(t.at)}</div></div><div style="text-align:right"><b class="${t.dir=='in'?'in':''}">${t.dir=='in'?'+':'-'}${fmt(t.mwk)}</b><div class="mute">${t.sats.toLocaleString()} sats</div></div></div>`).join('')||'<div class="mute">Nothing yet.</div>'}`}
const PC={'Entertainment':'🎬','Utilities':'💡','Transfer money':'🏦'};
const CH=(a,o)=>`<div class="chips">${[1000,5000,10000,20000].map(x=>`<button class="chip" onclick="$('#${a}').value=${x};pv('${a}','${o}')">${x/1000}k</button>`).join('')}</div>`;
function pay(){const o=U=='alice'?'bob':'alice',list=cat&&CATS[cat],f=PANIM?'ani':'';PANIM=false;

function newGoal(){openSheet(`<h3>What kind of goal?</h3><div class="grid2"><button class="alt opt" onclick="pick('personal')"><span>👤</span><b>Personal</b><small>Just for you</small></button><button class="alt opt" onclick="pick('group')"><span>👥</span><b>Group</b><small>Like a village bank, with ${cap(U=='alice'?'bob':'alice')}</small></button></div>`)}
function pick(t){G={type:t,emoji:'🎯'};openSheet(`<h3>${t=='group'?'New group goal':'New personal goal'}</h3><div class="ems">${EM.map(e=>`<button class="em ${e==G.emoji?'on':''}" aria-label="Pick ${e}" onclick="G.emoji='${e}';document.querySelectorAll('.em').forEach(b=>b.classList.toggle('on',b.textContent=='${e}'))">${e}</button>`).join('')}</div>
 <input id="gn" placeholder="Name (School fees, Trip, Village Bank...)"><input id="gt" type="number" min="1" placeholder="Target in MWK"><input id="gd" type="date" aria-label="Unlock date (optional)"><div class="mute">Stays locked until you reach the target. If you add a date, it also stays locked until that day, even if you reach the target sooner.</div><button class="wide" onclick="createGoal()">Create goal</button>`)}
async function createGoal(){try{await api('savings',{name:val('gn'),type:G.type,target:val('gt'),unlockDate:val('gd'),creator:U,members:['alice','bob'],emoji:G.emoji});closeSheet();toast('Goal created. Time to fill it!');await load();confetti()}catch(e){toast(e.message,1)}}
function topSheet(id){const s=S.savings.find(x=>x.id==id);openSheet(`<h3>Top up ${s.emoji||'🎯'} ${esc(s.name)}</h3><div class="mute">${fmt(s.target-s.saved>0?s.target-s.saved:0)} left to reach your goal</div><input id="tm" type="number" min="1" placeholder="Amount in MWK" oninput="pv('tm','tp')"><div class="chips">${[1000,5000,10000,20000].map(a=>`<button class="chip" onclick="$('#tm').value=${a};pv('tm','tp')">${a/1000}k</button>`).join('')}</div><div class="mute" id="tp"></div><button class="wide" onclick="topup('${id}')">Top up now</button>`)}
async function topup(id){if(busy)return;busy=true;const mwk=val('tm'),b=S.savings.find(x=>x.id==id),p0=pct(b);toast('Sending...');
 try{await api('savings/'+id+'/deposit',{user:U,mwk});closeSheet();await load();const a=S.savings.find(x=>x.id==id),p=pct(a);celebrate();
  const m=p>=100&&p0<100?100:[75,50,25].find(k=>p>=k&&p0<k);toast(m==100?'Goal reached! You did it!':m?m+'% of '+a.name+' saved!':'Saved. Nice one!');if(m)confetti()}
 catch(e){toast(e.message,1)}finally{busy=false}}
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=['#F2B632','#7DF0E2','#FFD98A','#fff','#9b8cff'];
 for(let i=0;i<46;i++){const d=document.createElement('i'),a=Math.random()*6.28,v=120+Math.random()*220;d.className='cf';
  d.style.cssText=`--x:${Math.cos(a)*v}px;--y:${Math.sin(a)*v-120}px;--r:${Math.random()*720}deg;background:${c[i%5]}`;document.body.appendChild(d);setTimeout(()=>d.remove(),1400)}}
$('#app').innerHTML='<div class="card sk"></div><div class="card sk"></div>';
load().catch(()=>$('#app').innerHTML='<div class="warn">Cannot reach the server'+(BASE?' at '+esc(BASE):'')+'. Is npm start running, and are you on the same Wi-Fi?</div><button class="wide" onclick="srvSheet()">Set server address</button>');
setInterval(()=>{if(tab=='home'&&!document.activeElement.matches('input'))load().catch(()=>{})},8000);
</script></body></html>
